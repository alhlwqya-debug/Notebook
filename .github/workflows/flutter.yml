name: Flutter Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # تم إزالة تحديد الإصدار المسبب للمشكلة وجعله يجلب أحدث إصدار مستقر تلقائياً
      - name: Set up Flutter (Latest Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # تنظيف كاش الحزم القديمة وجلب التوافقية الجديدة بنقاء
      - name: Clean and Get dependencies
        run: |
          flutter pub cache clean --force
          flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      # بناء الـ APK مع الحفاظ على الأيقونات ومنع تعارض التحميل
      - name: Build APK (release)
        run: flutter build apk --release --no-tree-shake-icons --no-pub

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: notebook-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

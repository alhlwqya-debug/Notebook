name: notebook_app
description: دفتري - تطبيق دفتر ملاحظات متقدم للغة العربية
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # قاعدة البيانات المحلية
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.8.3

  # إدارة الحالة
  provider: ^6.1.1

  # محرر النصوص الغني
  flutter_quill: ^9.2.10

  # تصدير PDF
  pdf: ^3.10.7
  printing: ^5.11.1

  # صيغ الملفات
  csv: ^5.1.1
  archive: ^3.4.10

  # اختيار الملفات
  file_picker: ^6.1.1

  # مشاركة الملفات
  share_plus: ^7.2.1

  # الأذونات
  permission_handler: ^11.1.0

  # منتقي الألوان
  flutter_colorpicker: ^1.0.3

  # اختيار الصور
  image_picker: ^1.0.7

  # مساعدات عامة
  uuid: ^4.2.1
  intl: ^0.18.1
  shared_preferences: ^2.2.2
  crypto: ^3.0.3
  flutter_staggered_grid_view: ^0.7.0

  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/templates/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700

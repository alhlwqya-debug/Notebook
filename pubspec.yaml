name: notebook
description: تطبيق احترافي لإدارة وإنشاء وتحرير جميع أنواع المستندات والدفاتر
version: 2.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Database
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0

  # File Sharing
  share_plus: ^9.0.0

  # UI
  google_fonts: ^6.2.1
  flutter_slidable: ^3.1.0

  # Routing
  go_router: ^14.2.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.2
  equatable: ^2.0.5
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/fonts/

  # fonts loaded via google_fonts package at runtime
